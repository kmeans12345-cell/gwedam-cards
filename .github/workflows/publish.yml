name: publish-to-instagram

on:
  schedule:
    # KST 18/20/21/22/23시 슬롯 커버: UTC 9-15시 동안 15분 간격으로 확인 (멱등)
    - cron: '*/15 9-15 * * *'
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'verify/request.txt'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync new posts from npm
        run: python3 scripts/sync_npm.py
      - name: Publish pending posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: '17841433148023062'
          REPO_SLUG: ${{ github.repository }}
        run: |
          # 이미지가 raw URL로 접근 가능해야 하므로, 새 포스트 파일을 먼저 커밋/푸시한 뒤 게시한다
          git config user.name "gwedam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "sync posts from npm [skip ci]"; git push origin main; }
          python3 scripts/publish.py
      - name: Commit results
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "results [skip ci]"
          git pull --rebase origin main || true
          git push origin main
